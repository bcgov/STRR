name: STRR NOC EXPIRY JOB CI

on:
  pull_request:
    paths:
      - ".github/workflows/strr-nod-expiry-ci.yaml"
      - "shared/python/cloud-sql-connector/**"
      - "scripts/prepare-python-build-context.py"
      - ".github/workflows/strr-python-ci.yaml"
      - "jobs/noc_expiry/**"
      - "tests/python-test-utils/**"
      - "src/strr_api/models/**"
      - "src/strr_api/services/**"
      - "src/strr_api/enums/**"
      - "src/strr_api/exceptions/**"
      - "src/strr_api/utils/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./jobs/noc_expiry

jobs:
  strr-noc-expiry-ci:
    uses: ./.github/workflows/strr-python-ci.yaml
    with:
      app_name: "strr-noc-expiry"
      working_directory: "./jobs/noc_expiry"
      codecov_flag: "nocjob"
      coverage_threshold: "80"
