name: STRR Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - "tests/workflows/**"
      - ".github/scripts/application_changes.py"
      - ".github/workflows/strr-terraform*.yaml"
      - ".github/workflows/strr-api-cd.yaml"
      - ".github/workflows/strr-email-cd.yaml"
      - ".github/workflows/strr-batch-validator-listener-cd.yaml"
      - ".github/workflows/strr-batch-validator-job-cd.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    name: Validate ${{ matrix.stack }} configuration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [api, email, validation]
    defaults:
      run:
        shell: bash
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive

      - name: Terraform init without cloud state
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        run: terraform validate

      - name: Terraform tests with mocked providers
        run: terraform test

  workflow-and-plan-policy:
    name: Check deployment gates and plan policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/terraform-workflow-tests"
          "$RUNNER_TEMP/terraform-workflow-tests/bin/python" -m pip install PyYAML==6.0.2
          echo "$RUNNER_TEMP/terraform-workflow-tests/bin" >> "$GITHUB_PATH"

      - name: Test deployment workflows
        run: python3 -m unittest discover -s tests/workflows -v

      - name: Test Terraform plan policy
        run: python3 -m unittest discover -s terraform/tests -v
