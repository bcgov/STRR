name: CI Gauntlet

on:
  push:
    branches: [ main, develop ]
    paths:
      - ".github/workflows/strr-interaction-updates-job-ci.yml"
      - "shared/python/cloud-sql-connector/**"
      - "scripts/prepare-python-build-context.py"
      - "jobs/interactions-update/**"
      - "tests/python-test-utils/**"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/strr-interaction-updates-job-ci.yml"
      - "shared/python/cloud-sql-connector/**"
      - "scripts/prepare-python-build-context.py"
      - "jobs/interactions-update/**"
      - "tests/python-test-utils/**"

# Set the default directory for all shell commands
defaults:
  run:
    working-directory: jobs/interactions-update

jobs:
  # --- STAGE 0: LINT & FORMAT ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'poetry'
          # We need to point the cache to the specific lock file in the subdir
          cache-dependency-path: |
            jobs/interactions-update/poetry.lock
            shared/python/cloud-sql-connector/**
      - name: Install dependencies
        run: poetry install
      - name: Run Linting
        run: make lint

  verify-build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify container build
        run: make build

  # --- STAGE 1: FAST FUNCTIONAL TESTS ---
  functional-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'poetry'
          cache-dependency-path: |
            jobs/interactions-update/poetry.lock
            shared/python/cloud-sql-connector/**
      - name: Install dependencies
        run: poetry install
      - name: Run Functional Tests
        run: poetry run pytest -m "not load"

  # --- STAGE 2: HEAVY LOAD TESTS ---
  load-tests:
    needs: functional-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'poetry'
          cache-dependency-path: |
            jobs/interactions-update/poetry.lock
            shared/python/cloud-sql-connector/**
      - name: Install dependencies
        run: poetry install
      - name: Run Load Tests
        run: poetry run pytest -m "load" --no-cov

  # --- STAGE 3: PERFORMANCE BENCHMARK ---
  performance-benchmark:
    needs: load-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'poetry'
          cache-dependency-path: |
            jobs/interactions-update/poetry.lock
            shared/python/cloud-sql-connector/**
      - name: Install dependencies
        run: poetry install
      - name: Run Benchmark
        # Generating JSON for the artifact
        run: poetry run pytest tests/load/test_benchmarks.py --benchmark-json benchmark_results.json --no-cov
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: python-benchmark-results
          path: jobs/interactions-update/benchmark_results.json
