name: STRR BASE WEB UI CI

on:
  pull_request:
    paths:
      - "strr-base-web/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./strr-base-web

jobs:
  strr-base-web-ci:
    uses: bcgov/bcregistry-sre/.github/workflows/frontend-ci.yaml@e6d847a51e7d15134761f29ae284a8acb0e369e0 # main
    with:
      app_name: "strr-base-web-ui"
      working_directory: "./strr-base-web"
      codecov_flag: "strrbasewebui"
      node_version: 24
      pnpm_version: 11.9.0
