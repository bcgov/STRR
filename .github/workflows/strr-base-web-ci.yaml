name: STRR BASE WEB UI CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "strr-base-web/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./strr-base-web

jobs:
  strr-base-web-ci:
    # Match the permissions required by the reusable frontend CI workflow.
    permissions:
      contents: read
      pull-requests: write
    uses: bcgov/bcregistry-sre/.github/workflows/frontend-ci.yaml@main
    with:
      app_name: "strr-base-web-ui"
      working_directory: "./strr-base-web"
      codecov_flag: "strrbasewebui"
      node_version: 24
