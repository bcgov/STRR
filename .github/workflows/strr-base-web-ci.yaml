name: STRR BASE WEB UI CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-regression:
    name: Combined source verification (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - strr-base-web
          - strr-host-pm-web
          - strr-platform-web
          - strr-strata-web
          - strr-examiner-web
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install local shared layer
        working-directory: strr-base-web
        run: pnpm install --frozen-lockfile
      - name: Install application
        if: matrix.app != 'strr-base-web'
        working-directory: ${{ matrix.app }}
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ${{ matrix.app }}
        run: pnpm run lint
      - name: Unit tests
        working-directory: ${{ matrix.app }}
        run: pnpm run test
      - name: Build
        working-directory: ${{ matrix.app }}
        run: pnpm run build-check
