name: STRR PAY CD

on:
  push:
    branches:
      - main
      - feature*
      - hotfix*
      - release*
    paths:
      - ".github/workflows/strr-pay-cd.yaml"
      - "shared/python/cloud-sql-connector/**"
      - "scripts/prepare-python-build-context.py"
      - "scripts/configure-iam-deployment.py"
      - ".github/workflows/strr-python-service-cd.yaml"
      - "queue_services/strr-pay/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy To"
        required: true
        type: choice
        options:
          - "dev"
          - "test"
          - "uat"
          - "sandbox"
          - "prod"
      redeploy:
        description: "Redeploy Application"
        required: true
        type: choice
        options:
          - "false"
          - "true"

jobs:
  strr-pay-cd:
    uses: ./.github/workflows/strr-python-service-cd.yaml
    with:
      target: ${{ inputs.target }}
      app_name: "strr-pay"
      working_directory: "queue_services/strr-pay"
      redeploy: ${{ inputs.redeploy }}
    secrets:
      WORKLOAD_IDENTIFY_POOLS_PROVIDER: ${{ secrets.WORKLOAD_IDENTIFY_POOLS_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
