name: STRR EMAIL CD

on:
  push:
    branches:
      - main
      - feature*
      - hotfix*
      - release*
    paths:
      - ".github/workflows/strr-email-cd.yaml"
      - "queue_services/strr-email/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy To"
        required: true
        type: choice
        options:
          - "dev"
          - "test"
          - "uat"
          - "sandbox"
          - "prod"

jobs:
  terraform:
    # Application deployments outside main/DEV keep their existing behavior.
    if: >-
      github.ref_protected &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'dev'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/strr-terraform.yaml
    with:
      stack: email
      action: apply

  strr-email-cd:
    needs: terraform
    if: >-
      !cancelled() &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    uses: bcgov/bcregistry-sre/.github/workflows/backend-cd.yaml@main
    with:
      target: ${{ inputs.target }}
      app_name: "strr-email"
      working_directory: "queue_services/strr-email"
      # IAM parameters are resolved by Cloud Deploy during a full deployment.
      redeploy: "false"
    secrets:
      WORKLOAD_IDENTIFY_POOLS_PROVIDER: ${{ secrets.WORKLOAD_IDENTIFY_POOLS_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
