name: STRR STRATA UI CI

on:
  pull_request:
    paths:
      - "strr-strata-web/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./strr-strata-web

jobs:
  strata-ui-ci:
    uses: bcgov/bcregistry-sre/.github/workflows/frontend-ci.yaml@e174092b408449f6bcb8a4d756c295cd72786faf # main
    with:
      app_name: "strr-strata-hotel-ui"
      working_directory: "./strr-strata-web"
      codecov_flag: "strrstrataui"
      node_version: 24
      pnpm_version: 11.9.0
