name: STRR API CI

on:
  pull_request:
    paths:
      - "strr-api/**"
      - "tests/python-test-utils/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./strr-api

jobs:
  strr-api-ci:
    uses: bcgov/bcregistry-sre/.github/workflows/backend-ci.yaml@e6d847a51e7d15134761f29ae284a8acb0e369e0 # main
    with:
      app_name: "strr-api"
      working_directory: "./strr-api"
      codecov_flag: "strrapi"
      coverage_threshold: "80"