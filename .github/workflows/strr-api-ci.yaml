name: STRR API CI

on:
  pull_request:
    paths:
      - "strr-api/**"
      - "tests/python-test-utils/**"
  workflow_dispatch:
    inputs:
      verification_scope:
        description: QA-only verification scope
        type: choice
        default: api
        options:
          - api
          - batch-images
          - pdf-diagnosis

defaults:
  run:
    shell: bash
    working-directory: ./strr-api

jobs:
  strr-api-ci:
    if: inputs.verification_scope == 'api' || github.event_name == 'pull_request'
    uses: bcgov/bcregistry-sre/.github/workflows/backend-ci.yaml@main
    with:
      app_name: "strr-api"
      working_directory: "./strr-api"
      codecov_flag: "strrapi"
      coverage_threshold: "80"

  python312:
    if: inputs.verification_scope == 'api' || github.event_name == 'pull_request'
    name: Full API suite on container Python version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FLASK_ENV: testing
      DEPLOYMENT_ENV: testing
      DATABASE_TEST_USERNAME: postgres
      DATABASE_TEST_PASSWORD: postgres
      DATABASE_TEST_NAME: unittesting
      DATABASE_TEST_HOST: localhost
      DATABASE_TEST_PORT: "5432"
      DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/unittesting
      JWT_OIDC_TEST_ISSUER: http://localhost:8081/auth/realms/demo
      JWT_OIDC_TEST_WELL_KNOWN_CONFIG: http://localhost:8081/auth/realms/demo/.well-known/openid-configuration
      JWT_OIDC_TEST_ALGORITHMS: RS256
      JWT_OIDC_TEST_AUDIENCE: sbc-auth-web
      JWT_OIDC_TEST_CLIENT_SECRET: "1111111111"
      JWT_OIDC_TEST_JWKS_CACHE_TIMEOUT: "6000"
      KEYCLOAK_TEST_ADMIN_CLIENTID: sbc-auth-admin
      KEYCLOAK_TEST_ADMIN_SECRET: "2222222222"
      KEYCLOAK_TEST_AUTH_AUDIENCE: sbc-auth-web
      KEYCLOAK_TEST_AUTH_CLIENT_SECRET: "1111111111"
      KEYCLOAK_TEST_BASE_URL: http://localhost:8081
      KEYCLOAK_TEST_REALMNAME: demo
      TOKEN_EXPIRY_PERIOD: "7"
      EMAIL_SECURITY_PASSWORD_SALT: my_pwd_salt
      EMAIL_TOKEN_SECRET_KEY: mySecretKey
      USE_TEST_KEYCLOAK_DOCKER: "YES"
      USE_DOCKER_MOCK: "YES"
      STAFF_ADMIN_EMAIL: test@test.com
    services:
      postgres:
        image: ghcr.io/bcgov/postgres15-postgis-anon
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unittesting
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pipx install poetry
      - name: Install locked dependencies
        run: |
          poetry env use "$(command -v python)"
          poetry install --no-interaction
          poetry run python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          git diff --exit-code -- pyproject.toml poetry.lock
      - name: Run full API tests
        run: poetry run pytest --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python312-coverage
          path: strr-api/coverage.xml
          retention-days: 7

  image-runtime:
    if: inputs.verification_scope == 'api' || github.event_name == 'pull_request'
    name: Upgraded libraries inside production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build exact candidate image
        run: docker build --build-arg VCS_REF="${GITHUB_SHA}" -t strr-python-verification .
      - name: Check installed libraries and PDF rendering
        run: docker run --rm -i strr-python-verification python < ../verification/api-image-smoke.py

  batch-image-runtime:
    if: inputs.verification_scope == 'batch-images'
    name: Production runtime - ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: batch-job
            directory: jobs/batch-permit-validator
          - component: backfiller
            directory: jobs/strr-backfiller
          - component: batch-listener
            directory: queue_services/batch-permit-validator
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify exact original application source
        run: |
          git fetch --no-tags --depth=1 origin cbb8177d1d0ce218ac2d3fa348329e91cae65c5b
          git diff --exit-code cbb8177d1d0ce218ac2d3fa348329e91cae65c5b HEAD -- jobs queue_services strr-api
      - name: Build production image with locked runtime dependencies
        run: |
          docker build --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg APP_ENV=production --target production_build \
            -t strr-batch-image-verification "${{ matrix.directory }}"
          docker image inspect strr-batch-image-verification \
            --format '{{json .Id}} {{json .Config.User}} {{json .Config.Cmd}}'
      - name: Run isolated production runtime checks
        run: |
          set -o pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -e QA_COMPONENT="${{ matrix.component }}" \
            -e SECRET_KEY=synthetic-local-only \
            -e DATABASE_USERNAME=qa -e DATABASE_PASSWORD=qa -e DATABASE_NAME=qa \
            -e DATABASE_HOST=127.0.0.1 -e DATABASE_PORT=5432 \
            -e BACKFILL_REGISTRATION_SEARCH=false -e FLASK_ENV=production \
            -e GCP_PROJECT_ID=synthetic-local-only \
            -e GCP_CLOUD_RUN_JOB_LOCATION=synthetic-location \
            -e GCP_CLOUD_RUN_JOB_NAME=synthetic-job \
            -v "${GITHUB_WORKSPACE}/verification/batch-image-smoke.py:/qa-smoke.py:ro" \
            strr-batch-image-verification python /qa-smoke.py \
            2>&1 | tee "${{ matrix.component }}-runtime.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.component }}-runtime
          path: ${{ matrix.component }}-runtime.log
          retention-days: 7

  pdf-dependency-diagnosis:
    if: inputs.verification_scope == 'pdf-diagnosis'
    name: Isolate PDF failure without changing application dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify original source and unchanged pre-PR dependencies
        run: |
          git fetch --no-tags --depth=1 origin cbb8177d1d0ce218ac2d3fa348329e91cae65c5b
          git fetch --no-tags --depth=1 origin 8c05dde179de669d71e3706324ef381dcfdacbd0
          git diff --exit-code cbb8177d1d0ce218ac2d3fa348329e91cae65c5b HEAD -- jobs queue_services strr-api
          git diff --exit-code 8c05dde179de669d71e3706324ef381dcfdacbd0 cbb8177d1d0ce218ac2d3fa348329e91cae65c5b -- strr-api/poetry.lock strr-api/pyproject.toml
      - name: Build unchanged production image
        run: |
          docker build --build-arg VCS_REF="${GITHUB_SHA}" --build-arg APP_ENV=production \
            --target production_build -t strr-pdf-diagnosis ./strr-api
          docker image inspect strr-pdf-diagnosis --format '{{json .Id}} {{json .Config.User}}'
      - name: Install hash-checked diagnostic control outside the image
        run: |
          python3 -m pip install --only-binary=:all: --no-deps --no-compile --require-hashes \
            --target ./pdf-control -r verification/pdf-control-requirements.txt
      - name: Reproduce failure with original locked packages
        run: |
          set -o pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "${GITHUB_WORKSPACE}/verification/pdf-dependency-probe.py:/qa-probe.py:ro" \
            strr-pdf-diagnosis python /qa-probe.py baseline | tee pdf-baseline.json
      - name: Change only the imported pydyf package for comparison
        run: |
          set -o pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -e PYTHONPATH=/pdf-control -v "${GITHUB_WORKSPACE}/pdf-control:/pdf-control:ro" \
            -v "${GITHUB_WORKSPACE}/verification/pdf-dependency-probe.py:/qa-probe.py:ro" \
            strr-pdf-diagnosis python /qa-probe.py control | tee pdf-control.json
      - name: Assert image input and all other package versions match
        run: |
          python3 -c 'import json; a=json.load(open("pdf-baseline.json")); b=json.load(open("pdf-control.json")); assert all(a[k] == b[k] for k in ("otherPackagesSha256", "lockSha256", "htmlSha256", "python", "weasyprint")); assert a["render"] == "expected-transform-failure"; assert b["render"] == "passed"; print("Only pydyf changed; locked baseline failed and isolated control rendered")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-dependency-diagnosis
          path: |
            pdf-baseline.json
            pdf-control.json
          retention-days: 7
