name: STRR API CI

on:
  pull_request:
    paths:
      - "strr-api/**"
      - "tests/python-test-utils/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./strr-api

jobs:
  strr-api-ci:
    uses: bcgov/bcregistry-sre/.github/workflows/backend-ci.yaml@e174092b408449f6bcb8a4d756c295cd72786faf # main
    with:
      app_name: "strr-api"
      working_directory: "./strr-api"
      codecov_flag: "strrapi"
      coverage_threshold: "80"