name: STRR PAY CI

on:
  pull_request:
    paths:
      - "strr-api/src/strr_api/common/cloud_sql.py"
      - "strr-api/pyproject.toml"
      - "strr-api/poetry.lock"
      - ".github/workflows/strr-pay-ci.yaml"
      - "queue_services/strr-pay/**"
      - "tests/python-test-utils/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./queue_services/strr-pay

jobs:
  strr-pay-ci:
    uses: bcgov/bcregistry-sre/.github/workflows/backend-ci.yaml@main
    with:
      app_name: "strr-pay"
      working_directory: "./queue_services/strr-pay"
      codecov_flag: "strrpay"
      coverage_threshold: "80"
