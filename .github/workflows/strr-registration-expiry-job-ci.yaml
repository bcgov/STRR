name: REGISTRATION EXPIRY JOB CI

on:
  pull_request:
    paths:
      - ".github/workflows/strr-registration-expiry-job-ci.yaml"
      - "shared/python/cloud-sql-connector/**"
      - "scripts/prepare-python-build-context.py"
      - ".github/workflows/strr-python-ci.yaml"
      - "jobs/registration_expiry/**"
      - "tests/python-test-utils/**"
      - "src/strr_api/models/**"
      - "src/strr_api/services/**"
      - "src/strr_api/enums/**"
      - "src/strr_api/exceptions/**"
      - "src/strr_api/utils/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./jobs/registration_expiry

jobs:
   registration-expiry-job-ci:
    uses: ./.github/workflows/strr-python-ci.yaml
    with:
      app_name: " registration-expiry-job-cd"
      working_directory: "./jobs/registration_expiry"
      codecov_flag: "regexpiryjob"
      coverage_threshold: "80"
