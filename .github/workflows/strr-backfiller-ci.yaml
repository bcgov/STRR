name: STRR BACKFILLER JOB CI

on:
  pull_request:
    paths:
      - ".github/workflows/strr-backfiller-ci.yaml"
      - "shared/python/cloud-sql-connector/**"
      - "scripts/prepare-python-build-context.py"
      - ".github/workflows/strr-python-ci.yaml"
      - "jobs/strr-backfiller/**"
      - "tests/python-test-utils/**"
      - "src/strr_api/models/**"
      - "src/strr_api/services/**"
      - "src/strr_api/enums/**"
      - "src/strr_api/exceptions/**"
      - "src/strr_api/utils/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./jobs/strr-backfiller

jobs:
  strr-backfiller-ci:
    uses: ./.github/workflows/strr-python-ci.yaml
    with:
      app_name: "strr-backfiller"
      working_directory: "./jobs/strr-backfiller"
      codecov_flag: "backfillerjob"
      coverage_threshold: "80"
