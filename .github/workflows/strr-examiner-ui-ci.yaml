name: STRR Examiner UI CI

on:
  pull_request:
    paths:
      - "strr-examiner-web/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./strr-examiner-web

jobs:
  examiner-ui-ci:
    uses: bcgov/bcregistry-sre/.github/workflows/frontend-ci.yaml@e174092b408449f6bcb8a4d756c295cd72786faf # main
    with:
      app_name: "strr-examiner-ui"
      working_directory: "./strr-examiner-web"
      codecov_flag: "strrexaminerui"
      node_version: 24
      pnpm_version: 11.9.0
