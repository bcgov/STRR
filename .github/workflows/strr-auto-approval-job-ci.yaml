name: STRR APPLICATION AUTO APPROVAL JOB CI

on:
  pull_request:
    paths:
      - ".github/workflows/strr-auto-approval-job-ci.yaml"
      - "shared/python/cloud-sql-connector/**"
      - "scripts/prepare-python-build-context.py"
      - ".github/workflows/strr-python-ci.yaml"
      - "jobs/auto-approval/**"
      - "tests/python-test-utils/**"
      - "src/strr_api/models/**"
      - "src/strr_api/services/**"
      - "src/strr_api/enums/**"
      - "src/strr_api/exceptions/**"
      - "src/strr_api/utils/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./jobs/auto-approval

jobs:
  strr-auto-approval-ci:
    uses: ./.github/workflows/strr-python-ci.yaml
    with:
      app_name: "strr-auto-approval"
      working_directory: "./jobs/auto-approval"
      codecov_flag: "approvaljob"
      coverage_threshold: "80"
