name: main-e2e-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-payment-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install browser test dependency
        working-directory: verification/test-payments
        run: npm ci --ignore-scripts --no-audit
      - name: Install Chromium
        working-directory: verification/test-payments
        run: npx playwright install --with-deps chromium
      - name: Check TEST login and payment account
        working-directory: verification/test-payments
        env:
          PLAYWRIGHT_TEST_BCSC_USERNAME: ${{ secrets.PLAYWRIGHT_TEST_BCSC_USERNAME }}
          PLAYWRIGHT_TEST_BCSC_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_BCSC_PASSWORD }}
        run: node preflight.mjs
      - name: Upload sanitized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-payment-preflight
          path: verification/test-payments/results/*.json
          if-no-files-found: warn
          retention-days: 7
