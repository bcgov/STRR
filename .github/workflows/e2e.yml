name: main-e2e-tests

on:
  workflow_dispatch:
    inputs:
      app:
        description: Deployed TEST app to verify
        type: choice
        required: true
        default: all
        options: [all, host, platform, strata]
      mode:
        description: Read-only login checks or resume the QA416 synthetic invoices
        type: choice
        required: true
        default: read-only
        options: [read-only, checkout]
      expected_bundle_hashes:
        description: JSON object of deployed entry SHA256 hashes keyed by host, platform, strata
        type: string
        required: true

permissions:
  contents: read

jobs:
  deployed-payment-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_APP: ${{ inputs.app }}
      QA_MODE: ${{ inputs.mode }}
      EXPECTED_BUNDLE_HASHES: ${{ inputs.expected_bundle_hashes }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install browser test dependency
        working-directory: verification/test-payments
        run: npm ci --ignore-scripts --no-audit
      - name: Check runner Chrome
        run: google-chrome --version
      - name: Verify the deployed TEST apps
        working-directory: verification/test-payments
        env:
          PLAYWRIGHT_TEST_BCSC_USERNAME: ${{ secrets.PLAYWRIGHT_TEST_BCSC_USERNAME }}
          PLAYWRIGHT_TEST_BCSC_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_BCSC_PASSWORD }}
          CYPRESS_CREDITCARD: ${{ inputs.mode == 'checkout' && secrets.CYPRESS_CREDITCARD || '' }}
        run: node preflight.mjs
      - name: Upload sanitized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg18-test-payment-preflight
          path: verification/test-payments/results/*.json
          if-no-files-found: warn
          retention-days: 7
