name: REGISTRATION RENEWAL REMINDERS JOB CI

on:
  pull_request:
    paths:
      - ".github/workflows/strr-renewal-reminders-ci.yaml"
      - "shared/python/cloud-sql-connector/**"
      - "scripts/prepare-python-build-context.py"
      - ".github/workflows/strr-python-ci.yaml"
      - "jobs/renewal-reminders**"
      - "tests/python-test-utils/**"
      - "src/strr_api/models/**"
      - "src/strr_api/services/**"
      - "src/strr_api/enums/**"
      - "src/strr_api/exceptions/**"
      - "src/strr_api/utils/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./jobs/renewal-reminders

jobs:
  renewal-reminders-job-ci:
    uses: ./.github/workflows/strr-python-ci.yaml
    with:
      app_name: "renewal-reminders-job"
      working_directory: "./jobs/renewal-reminders"
      codecov_flag: "renewalRemindersjob"
      coverage_threshold: "80"
