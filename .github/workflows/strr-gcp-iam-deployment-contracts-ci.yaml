name: STRR GCP IAM deployment contracts

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/strr-gcp-iam-deployment-contracts-ci.yaml"
      - "tests/deployment/**"
      - "shared/python/cloud-sql-connector/**"
      - "scripts/prepare-python-build-context.py"
      - "scripts/configure-iam-deployment.py"
      - "scripts/verify-cloud-sql-iam.py"
      - ".github/workflows/strr-python-*.yaml"
      - "jobs/*/pyproject.toml"
      - "jobs/*/poetry.lock"
      - "jobs/*/Dockerfile"
      - "jobs/*/Makefile"
      - "queue_services/strr-*/pyproject.toml"
      - "queue_services/strr-*/poetry.lock"
      - "queue_services/strr-*/Dockerfile"
      - "queue_services/strr-*/Makefile"
      - "queue_services/strr-*/devops/vaults.gcp.env"
      - "queue_services/strr-*/devops/gcp/clouddeploy.yaml"
      - "jobs/*/devops/vaults.gcp.env"
      - "jobs/*/devops/gcp/clouddeploy.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/strr-gcp-iam-deployment-contracts-ci.yaml"
      - "tests/deployment/**"
      - "shared/python/cloud-sql-connector/**"
      - "scripts/prepare-python-build-context.py"
      - "scripts/configure-iam-deployment.py"
      - "scripts/verify-cloud-sql-iam.py"
      - ".github/workflows/strr-python-*.yaml"
      - "jobs/*/pyproject.toml"
      - "jobs/*/poetry.lock"
      - "jobs/*/Dockerfile"
      - "jobs/*/Makefile"
      - "queue_services/strr-*/pyproject.toml"
      - "queue_services/strr-*/poetry.lock"
      - "queue_services/strr-*/Dockerfile"
      - "queue_services/strr-*/Makefile"
      - "queue_services/strr-*/devops/vaults.gcp.env"
      - "queue_services/strr-*/devops/gcp/clouddeploy.yaml"
      - "jobs/*/devops/vaults.gcp.env"
      - "jobs/*/devops/gcp/clouddeploy.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Cloud SQL IAM deployment contracts
        run: python -m unittest discover -s tests/deployment
      - name: Install Poetry
        run: pipx install poetry==2.3.2 --pip-args="--only-binary=:all:"
      - name: Install locked shared package and test tools
        working-directory: shared/python/cloud-sql-connector
        run: |
          poetry config installer.only-binary :all:
          poetry install
      - name: Test shared Cloud SQL package
        working-directory: shared/python/cloud-sql-connector
        run: poetry run pytest
