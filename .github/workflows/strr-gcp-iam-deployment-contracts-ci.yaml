name: STRR GCP IAM deployment contracts

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/strr-gcp-iam-deployment-contracts-ci.yaml"
      - ".github/workflows/*-cd.yaml"
      - "tests/deployment/**"
      - "jobs/*/pyproject.toml"
      - "jobs/*/poetry.lock"
      - "queue_services/strr-*/pyproject.toml"
      - "queue_services/strr-*/poetry.lock"
      - "strr-api/src/strr_api/common/cloud_sql.py"
      - "jobs/*/src/**/config.py"
      - "jobs/interactions-update/src/interactions_update/database.py"
      - "queue_services/strr-*/src/**/config.py"
      - "jobs/*/devops/vaults.gcp.env"
      - "jobs/*/devops/gcp/clouddeploy.yaml"
      - "queue_services/strr-*/devops/vaults.gcp.env"
      - "queue_services/strr-*/devops/gcp/clouddeploy.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/strr-gcp-iam-deployment-contracts-ci.yaml"
      - ".github/workflows/*-cd.yaml"
      - "tests/deployment/**"
      - "jobs/*/pyproject.toml"
      - "jobs/*/poetry.lock"
      - "queue_services/strr-*/pyproject.toml"
      - "queue_services/strr-*/poetry.lock"
      - "strr-api/src/strr_api/common/cloud_sql.py"
      - "jobs/*/src/**/config.py"
      - "jobs/interactions-update/src/interactions_update/database.py"
      - "queue_services/strr-*/src/**/config.py"
      - "jobs/*/devops/vaults.gcp.env"
      - "jobs/*/devops/gcp/clouddeploy.yaml"
      - "queue_services/strr-*/devops/vaults.gcp.env"
      - "queue_services/strr-*/devops/gcp/clouddeploy.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Cloud SQL IAM deployment contracts
        run: python -m unittest discover -s tests/deployment
