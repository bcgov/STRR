name: BATCH PERMIT LISTENER CD

on:
  push:
    branches:
      - main
      - feature*
      - hotfix*
      - release*
    paths:
      - "queue_services/batch-permit-validator/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy To"
        required: true
        type: choice
        options:
          - "dev"
          - "test"
          - "uat"
          - "sandbox"
          - "prod"
      redeploy:
        description: "Redeploy Application"
        required: true
        type: choice
        options:
          - "false"
          - "true"

jobs:
  terraform:
    # Application deployments outside main/DEV keep their existing behavior.
    if: >-
      github.ref_protected &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'dev'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/strr-terraform.yaml
    with:
      stack: validation
      action: apply

  batch-permit-listener-cd:
    needs: terraform
    if: >-
      !cancelled() &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    uses: bcgov/bcregistry-sre/.github/workflows/backend-cd.yaml@main
    with:
      target: ${{ inputs.target }}
      app_name: "batch-permit-listener"
      working_directory: "queue_services/batch-permit-validator"
      redeploy: ${{ inputs.redeploy }}
    secrets:
      WORKLOAD_IDENTIFY_POOLS_PROVIDER: ${{ secrets.WORKLOAD_IDENTIFY_POOLS_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
