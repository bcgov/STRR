openapi: 3.0.3
info:
  title: BC Short-Term Rental Registry - Registration Export API
  version: '1.0.0'
  termsOfService: 'https://developer.connect.gov.bc.ca/shared/api-terms-of-use.pdf'
  contact:
    url: 'https://www2.gov.bc.ca/gov/content/housing-tenancy/short-term-rentals'
    name: BC Registries and Online Services
  description: |-
    System-to-system and authorized portal API providing complete current registration snapshots for `HOST`, `PLATFORM`, and `STRATA_HOTEL` registrations.

    Supports two retrieval patterns:
    1. **Incremental Polling (CDC)** for the Ministry of Finance using `updatedSince` and cursor-based pagination.
    2. **Targeted Registration Lookup** for the STR Data Portal using a bounded `registrationNumbers` array.

    > **HTTP Method Note:** `QUERY /registrations/export` is under consideration for a safe, idempotent body-based query. Where client libraries, gateways, or WAF infrastructure require standard OpenAPI 3.0 methods, `POST /registrations/export` uses the identical path, request body, authentication, and response contract.
  license:
    name: BSD-3-Clause
    url: 'https://opensource.org/license/bsd-3-clause'
servers:
  - url: 'https://sandbox.api.connect.gov.bc.ca/strr/v1'
    description: Sandbox / Test
  - url: 'https://api.connect.gov.bc.ca/strr/v1'
    description: Production
tags:
  - name: Registration Export
    description: Incremental CDC polling and targeted registration snapshot retrieval.
security:
  - bearerAuth: []
paths:
  /registrations/export:
    post:
      tags:
        - Registration Export
      summary: Export current registration snapshots
      operationId: exportRegistrations
      description: |-
        Returns a paginated list of complete current registration snapshots (`HOST`, `PLATFORM`, `STRATA_HOTEL`).
        - Omit `updatedSince` and `cursor` for an initial full synchronization.
        - Provide `nextCursor` as `cursor` on subsequent requests until `nextCursor` is `null`.
        - Provide `registrationNumbers` for targeted Data Portal lookups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationExportRequest'
            examples:
              MinistryOfFinanceInitialSync:
                summary: Ministry of Finance - Initial Full Sync
                value:
                  limit: 500
              MinistryOfFinanceIncrementalPoll:
                summary: Ministry of Finance - Incremental CDC Poll
                value:
                  updatedSince: '2026-09-01T00:00:00Z'
                  cursor: 'eyJ2ZXJzaW9uIjoxLCJwb3NpdGlvbiI6ey...'
                  limit: 500
              DataPortalTargetedLookup:
                summary: Data Portal - Targeted Lookup by Registration Numbers
                value:
                  registrationNumbers:
                    - H123456789
                    - PL100000001
                    - ST200000001
                  limit: 100
      responses:
        '200':
          description: Paginated list of current registration snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationExportResponse'
              examples:
                IncrementalExportPage:
                  summary: Page containing HOST, PLATFORM, and STRATA_HOTEL snapshots
                  value:
